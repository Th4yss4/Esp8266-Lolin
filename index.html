<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP8266 · Painel</title>
<style>
:root{
  --bg:#f3f5f7; --panel:#fff; --ink:#14202b; --mute:#5d6b78; --line:#d9e0e6;
  --accent:#0a8f7a; --accent2:#d1495b; --ok:#1c9c4f; --off:#9aa5af;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1519; --panel:#172027; --ink:#e6edf2; --mute:#8fa0ad; --line:#26333c;
    --accent:#35c9ae; --accent2:#ef7a89; --ok:#4cd07f; --off:#5d6b78;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:1.25rem;margin:0}
h2{font-size:1rem;margin:0 0 12px}
.status{display:inline-flex;align-items:center;gap:8px;color:var(--mute);font-size:.9rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--off)}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.live{display:grid;grid-template-columns:minmax(220px,1.2fr) 1fr;gap:24px;align-items:center}
@media(max-width:640px){.live{grid-template-columns:1fr}}
.gauge{text-align:center}
.gauge svg{width:100%;max-width:320px}
.gauge .track{stroke:var(--line)}
.gauge .fill{stroke:var(--accent);transition:stroke-dasharray .5s}
.gauge .val{font-size:2.6rem;font-weight:700;fill:var(--ink)}
.gauge .lab{font-size:.8rem;fill:var(--mute)}
dl{margin:0;display:grid;gap:14px}
dl div{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px}
dt{color:var(--mute)}
dd{margin:0;font-weight:600;font-size:1.1rem}
.chip{padding:2px 10px;border-radius:99px;font-size:.9rem;background:var(--line);color:var(--mute)}
.chip.on{background:var(--accent);color:#fff}
.chart{position:relative;height:260px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500}
#login{max-width:360px;margin:12vh auto 0}
#login label{display:block;margin:12px 0 4px;color:var(--mute);font-size:.9rem}
#login input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.err{color:var(--accent2);min-height:1.4em;margin:12px 0 0;font-size:.9rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>

<section id="login" class="panel" hidden>
  <h1>Entrar no painel</h1>
  <p style="color:var(--mute);margin:6px 0 0">Use o usuário criado em Authentication no Supabase.</p>
  <label for="email">E-mail</label>
  <input id="email" type="email" autocomplete="username">
  <label for="senha">Senha</label>
  <input id="senha" type="password" autocomplete="current-password">
  <p class="err" id="erroLogin" role="alert"></p>
  <button class="primary" id="btnEntrar" style="width:100%">Entrar</button>
</section>

<section id="app" hidden>
  <header>
    <div>
      <h1 id="titulo">ESP8266</h1>
      <span class="status"><span class="dot" id="dot"></span><span id="statusTxt">Carregando…</span></span>
    </div>
    <button id="btnSair">Sair</button>
  </header>

  <div class="panel live">
    <div class="gauge">
      <svg viewBox="0 0 200 120" role="img" aria-label="Potenciômetro">
        <path class="track" d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke-width="14" stroke-linecap="round" pathLength="100"/>
        <path class="fill" id="arco" d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/>
        <text class="val" id="potVal" x="100" y="88" text-anchor="middle">–</text>
        <text class="lab" x="100" y="112" text-anchor="middle">potenciômetro (0–1023)</text>
      </svg>
    </div>
    <dl>
      <div><dt>Botão físico</dt><dd><span class="chip" id="chipBotao">–</span></dd></div>
      <div><dt>LED</dt><dd><span class="chip" id="chipLed">–</span></dd></div>
      <div><dt>Intensidade do LED</dt><dd id="intens">–</dd></div>
      <div><dt>Última leitura</dt><dd id="quando" style="font-size:.95rem">–</dd></div>
    </dl>
  </div>

  <div class="panel">
    <h2>Últimas 100 leituras</h2>
    <div class="chart"><canvas id="grafico"></canvas></div>
  </div>

  <div class="panel">
    <h2>Eventos recentes</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Quando</th><th>Origem</th><th>Pino</th><th>Nome</th><th>Valor</th></tr></thead>
        <tbody id="eventos"><tr><td colspan="5">Sem eventos ainda.</td></tr></tbody>
      </table>
    </div>
  </div>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
// ====== CONFIGURE AQUI ======
const SUPABASE_URL = "https://sescaaxyvpmhnpxcqozp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Qfg9H0ZjPKRkobj7LqkV8Q_3KwgN_8z";
const DISPOSITIVO = "esp8266-01";
const ATUALIZAR_MS = 5000;
// ============================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let grafico, timer;

const fmt = iso => new Date(iso).toLocaleString("pt-BR", {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
const hora = iso => new Date(iso).toLocaleTimeString("pt-BR", {hour:"2-digit",minute:"2-digit"});

function chip(el, on, txtOn, txtOff){
  el.textContent = on ? txtOn : txtOff;
  el.classList.toggle("on", on);
}

async function carregar(){
  const { data: l, error } = await sb.from("leituras").select("*")
    .eq("dispositivo", DISPOSITIVO).order("criado_em", {ascending:false}).limit(100);
  if (error){ $("statusTxt").textContent = "Erro: " + error.message; return; }

  if (l.length){
    const u = l[0];
    $("potVal").textContent = u.potenciometro;
    $("arco").setAttribute("stroke-dasharray", (u.potenciometro/1023*100) + " 100");
    chip($("chipBotao"), u.botao_pressionado, "Pressionado", "Solto");
    chip($("chipLed"), u.led_ligado, "Ligado", "Desligado");
    $("intens").textContent = u.intensidade_led;
    $("quando").textContent = fmt(u.criado_em);
    const idade = (Date.now() - new Date(u.criado_em)) / 1000;
    const online = idade < 90;
    $("dot").classList.toggle("on", online);
    $("statusTxt").textContent = online ? "Online" : "Sem sinal há " + Math.round(idade/60) + " min";

    const asc = [...l].reverse();
    grafico.data.labels = asc.map(x => hora(x.criado_em));
    grafico.data.datasets[0].data = asc.map(x => x.potenciometro);
    grafico.data.datasets[1].data = asc.map(x => x.intensidade_led);
    grafico.update("none");
  } else {
    $("statusTxt").textContent = "Nenhuma leitura para " + DISPOSITIVO;
  }

  const { data: e } = await sb.from("eventos").select("*")
    .eq("dispositivo", DISPOSITIVO).order("criado_em", {ascending:false}).limit(15);
  if (e && e.length){
    $("eventos").innerHTML = e.map(x =>
      `<tr><td>${fmt(x.criado_em)}</td><td>${x.origem}</td><td>${x.pino_virtual ?? ""}</td><td>${x.nome}</td><td>${x.valor ?? ""}</td></tr>`
    ).join("");
  }
}

function iniciarGrafico(){
  const css = getComputedStyle(document.documentElement);
  grafico = new Chart($("grafico"), {
    type: "line",
    data: { labels: [], datasets: [
      { label: "Potenciômetro", data: [], borderColor: css.getPropertyValue("--accent").trim(), borderWidth: 2, pointRadius: 0, tension: .25 },
      { label: "Intensidade LED", data: [], borderColor: css.getPropertyValue("--accent2").trim(), borderWidth: 2, pointRadius: 0, tension: .25 }
    ]},
    options: { responsive: true, maintainAspectRatio: false,
      scales: { x: { ticks: { maxTicksLimit: 8 } } },
      plugins: { legend: { position: "bottom" } } }
  });
}

function mostrarApp(){
  $("login").hidden = true; $("app").hidden = false;
  $("titulo").textContent = DISPOSITIVO;
  if (!grafico) iniciarGrafico();
  carregar();
  clearInterval(timer);
  timer = setInterval(carregar, ATUALIZAR_MS);
}

function mostrarLogin(){
  clearInterval(timer);
  $("app").hidden = true; $("login").hidden = false;
}

$("btnEntrar").onclick = async () => {
  $("erroLogin").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("senha").value });
  if (error) $("erroLogin").textContent = "Não foi possível entrar: " + error.message;
};
$("senha").addEventListener("keydown", e => { if (e.key === "Enter") $("btnEntrar").click(); });
$("btnSair").onclick = () => sb.auth.signOut();

sb.auth.onAuthStateChange((_ev, session) => session ? mostrarApp() : mostrarLogin());
sb.auth.getSession().then(({data}) => data.session ? mostrarApp() : mostrarLogin());
</script>
</body>
</html>
