<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP8266 · Painel</title>
<style>
:root{
  --bg:#f3f5f7; --panel:#fff; --ink:#14202b; --mute:#5d6b78; --line:#d9e0e6;
  --accent:#0a8f7a; --accent2:#d1495b; --ok:#1c9c4f; --off:#9aa5af;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1519; --panel:#172027; --ink:#e6edf2; --mute:#8fa0ad; --line:#26333c;
    --accent:#35c9ae; --accent2:#ef7a89; --ok:#4cd07f; --off:#5d6b78;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:1.25rem;margin:0}
h2{font-size:1rem;margin:0 0 12px}
.status{display:inline-flex;align-items:center;gap:8px;color:var(--mute);font-size:.9rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--off)}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.filtros{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:12px}
.filtros label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute)}
.contagem{color:var(--mute);font-size:.85rem;margin:0 0 8px}
input[type=date]{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
input[type=date]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.live{display:grid;grid-template-columns:minmax(220px,1.2fr) 1fr;gap:24px;align-items:center}
@media(max-width:640px){.live{grid-template-columns:1fr}}
.gauge{text-align:center}
.gauge svg{width:100%;max-width:320px}
.gauge .track{stroke:var(--line)}
.gauge .fill{stroke:var(--accent);transition:stroke-dasharray .5s}
.gauge .val{font-size:2.6rem;font-weight:700;fill:var(--ink)}
.gauge .lab{font-size:.8rem;fill:var(--mute)}
dl{margin:0;display:grid;gap:14px}
dl div{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px}
dt{color:var(--mute)}
dd{margin:0;font-weight:600;font-size:1.1rem}
.chip{padding:2px 10px;border-radius:99px;font-size:.9rem;background:var(--line);color:var(--mute)}
.chip.on{background:var(--accent);color:#fff}
.chart{position:relative;height:260px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500}
#login{max-width:360px;margin:12vh auto 0}
#login label{display:block;margin:12px 0 4px;color:var(--mute);font-size:.9rem}
#login input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.err{color:var(--accent2);min-height:1.4em;margin:12px 0 0;font-size:.9rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>

<section id="login" class="panel" hidden>
  <h1>Entrar no painel</h1>
  <p style="color:var(--mute);margin:6px 0 0">Use o usuário criado em Authentication no Supabase.</p>
  <label for="email">E-mail</label>
  <input id="email" type="email" autocomplete="username">
  <label for="senha">Senha</label>
  <input id="senha" type="password" autocomplete="current-password">
  <p class="err" id="erroLogin" role="alert"></p>
  <button class="primary" id="btnEntrar" style="width:100%">Entrar</button>
</section>

<section id="app" hidden>
  <header>
    <div>
      <h1 id="titulo">ESP8266</h1>
      <span class="status"><span class="dot" id="dot"></span><span id="statusTxt">Carregando…</span></span>
    </div>
    <div style="display:flex;gap:8px">
      <select id="formato" aria-label="Formato do arquivo">
        <option value="json">JSON (.json)</option>
        <option value="xlsx">Excel (.xlsx)</option>
      </select>
      <button id="btnBaixar">Baixar</button>
      <button id="btnSair">Sair</button>
    </div>
  </header>

  <div class="panel live">
    <div class="gauge">
      <svg viewBox="0 0 200 120" role="img" aria-label="Potenciômetro">
        <path class="track" d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke-width="14" stroke-linecap="round" pathLength="100"/>
        <path class="fill" id="arco" d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/>
        <text class="val" id="potVal" x="100" y="88" text-anchor="middle">–</text>
        <text class="lab" x="100" y="112" text-anchor="middle">potenciômetro (0–1023)</text>
      </svg>
    </div>
    <dl>
      <div><dt>Botão físico</dt><dd><span class="chip" id="chipBotao">–</span></dd></div>
      <div><dt>LED</dt><dd><span class="chip" id="chipLed">–</span></dd></div>
      <div><dt>Intensidade do LED</dt><dd id="intens">–</dd></div>
      <div><dt>Última leitura</dt><dd id="quando" style="font-size:.95rem">–</dd></div>
    </dl>
  </div>

  <div class="panel">
    <h2>Últimas 100 leituras</h2>
    <div class="chart"><canvas id="grafico"></canvas></div>
  </div>

  <div class="panel">
    <h2>Eventos</h2>
    <div class="filtros">
      <label>Origem
        <select id="fOrigem">
          <option value="">Todas</option>
          <option value="blynk">Blynk</option>
          <option value="fisico">Físico</option>
          <option value="sistema">Sistema</option>
        </select>
      </label>
      <label>Evento
        <select id="fNome">
          <option value="">Todos</option>
          <option value="botao_led">Botão do LED</option>
          <option value="intensidade_led">Intensidade do LED</option>
          <option value="botao_fisico">Botão físico</option>
        </select>
      </label>
      <label>Ordenar por
        <select id="fOrdem">
          <option value="recentes">Mais recentes</option>
          <option value="antigos">Mais antigos</option>
          <option value="tipo">Tipo de evento</option>
          <option value="situacao">Situação (valor)</option>
        </select>
      </label>
      <label>De <input type="date" id="fDe"></label>
      <label>Até <input type="date" id="fAte"></label>
      <button id="fLimpar">Limpar filtros</button>
    </div>
    <p class="contagem" id="contagem"></p>
    <div class="scroll">
      <table>
        <thead><tr><th>Quando</th><th>Origem</th><th>Pino</th><th>Nome</th><th>Valor</th></tr></thead>
        <tbody id="eventos"><tr><td colspan="5">Sem eventos ainda.</td></tr></tbody>
      </table>
    </div>
  </div>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
// ====== CONFIGURE AQUI ======
const SUPABASE_URL = "https://sescaaxyvpmhnpxcqozp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Qfg9H0ZjPKRkobj7LqkV8Q_3KwgN_8z";
const DISPOSITIVO = "esp8266-01";
const ATUALIZAR_MS = 30000; // reserva; o Realtime atualiza na hora
// ============================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let grafico, timer;

const fmt = iso => new Date(iso).toLocaleString("pt-BR", {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
const hora = iso => new Date(iso).toLocaleTimeString("pt-BR", {hour:"2-digit",minute:"2-digit"});

function chip(el, on, txtOn, txtOff){
  el.textContent = on ? txtOn : txtOff;
  el.classList.toggle("on", on);
}

async function carregar(){
  const { data: l, error } = await sb.from("leituras").select("*")
    .eq("dispositivo", DISPOSITIVO).order("criado_em", {ascending:false}).limit(100);
  if (error){ $("statusTxt").textContent = "Erro: " + error.message; return; }

  if (l.length){
    const u = l[0];
    $("potVal").textContent = u.potenciometro;
    $("arco").setAttribute("stroke-dasharray", (u.potenciometro/1023*100) + " 100");
    chip($("chipBotao"), u.botao_pressionado, "Pressionado", "Solto");
    chip($("chipLed"), u.led_ligado, "Ligado", "Desligado");
    $("intens").textContent = u.intensidade_led;
    $("quando").textContent = fmt(u.criado_em);
    const idade = (Date.now() - new Date(u.criado_em)) / 1000;
    const online = idade < 90;
    $("dot").classList.toggle("on", online);
    $("statusTxt").textContent = online ? "Online" : "Sem sinal há " + Math.round(idade/60) + " min";

    const asc = [...l].reverse();
    grafico.data.labels = asc.map(x => hora(x.criado_em));
    grafico.data.datasets[0].data = asc.map(x => x.potenciometro);
    grafico.data.datasets[1].data = asc.map(x => x.intensidade_led);
    grafico.update("none");
  } else {
    $("statusTxt").textContent = "Nenhuma leitura para " + DISPOSITIVO;
  }

  await carregarEventos();
}

const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function carregarEventos(){
  let q = sb.from("eventos").select("*").eq("dispositivo", DISPOSITIVO);
  if ($("fOrigem").value) q = q.eq("origem", $("fOrigem").value);
  if ($("fNome").value)   q = q.eq("nome", $("fNome").value);
  if ($("fDe").value)     q = q.gte("criado_em", new Date($("fDe").value + "T00:00:00").toISOString());
  if ($("fAte").value)    q = q.lte("criado_em", new Date($("fAte").value + "T23:59:59.999").toISOString());
  const { data: e, error } = await q.order("criado_em", {ascending: $("fOrdem").value === "antigos"}).limit(50);
  if (error){ $("contagem").textContent = "Erro ao filtrar: " + error.message; return; }

  // Tipo e situação reorganizam os 50 eventos já carregados (mais recentes)
  const maisNovo = (a, b) => new Date(b.criado_em) - new Date(a.criado_em);
  if ($("fOrdem").value === "tipo")     e.sort((a, b) => String(a.nome).localeCompare(String(b.nome)) || maisNovo(a, b));
  if ($("fOrdem").value === "situacao") e.sort((a, b) => (Number(b.valor ?? -1) - Number(a.valor ?? -1)) || maisNovo(a, b));

  const filtrado = $("fOrigem").value || $("fNome").value || $("fDe").value || $("fAte").value;
  $("contagem").textContent = e.length + (e.length === 50 ? "+" : "") + " evento(s)" + (filtrado ? " com os filtros aplicados" : ($("fOrdem").value === "antigos" ? " mais antigos" : " mais recentes"));
  $("eventos").innerHTML = e.length
    ? e.map(x => `<tr><td>${fmt(x.criado_em)}</td><td>${esc(x.origem)}</td><td>${esc(x.pino_virtual)}</td><td>${esc(x.nome)}</td><td>${esc(x.valor)}</td></tr>`).join("")
    : `<tr><td colspan="5">Nenhum evento encontrado.</td></tr>`;
}

['fOrigem','fNome','fOrdem','fDe','fAte'].forEach(id => $(id).addEventListener("change", carregarEventos));
$("fLimpar").onclick = () => {
  ['fOrigem','fNome','fDe','fAte'].forEach(id => $(id).value = "");
  $("fOrdem").value = "recentes";
  carregarEventos();
};

function iniciarGrafico(){
  const css = getComputedStyle(document.documentElement);
  grafico = new Chart($("grafico"), {
    type: "line",
    data: { labels: [], datasets: [
      { label: "Potenciômetro", data: [], borderColor: css.getPropertyValue("--accent").trim(), borderWidth: 2, pointRadius: 0, tension: .25 },
      { label: "Intensidade LED", data: [], borderColor: css.getPropertyValue("--accent2").trim(), borderWidth: 2, pointRadius: 0, tension: .25 }
    ]},
    options: { responsive: true, maintainAspectRatio: false,
      scales: { x: { ticks: { maxTicksLimit: 8 } } },
      plugins: { legend: { position: "bottom" } } }
  });
}

let canal;

function assinarRealtime(){
  if (canal) sb.removeChannel(canal);
  canal = sb.channel("painel-" + DISPOSITIVO)
    .on("postgres_changes",
        { event: "INSERT", schema: "public", table: "leituras", filter: "dispositivo=eq." + DISPOSITIVO },
        () => carregar())
    .on("postgres_changes",
        { event: "INSERT", schema: "public", table: "eventos", filter: "dispositivo=eq." + DISPOSITIVO },
        () => carregar())
    .subscribe();
}

function mostrarApp(){
  $("login").hidden = true; $("app").hidden = false;
  $("titulo").textContent = DISPOSITIVO;
  if (!grafico) iniciarGrafico();
  carregar();
  assinarRealtime();
  clearInterval(timer);
  timer = setInterval(carregar, ATUALIZAR_MS);
}

function mostrarLogin(){
  clearInterval(timer);
  if (canal){ sb.removeChannel(canal); canal = null; }
  $("app").hidden = true; $("login").hidden = false;
}

$("btnEntrar").onclick = async () => {
  $("erroLogin").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("senha").value });
  if (error) $("erroLogin").textContent = "Não foi possível entrar: " + error.message;
};
$("senha").addEventListener("keydown", e => { if (e.key === "Enter") $("btnEntrar").click(); });
$("btnSair").onclick = () => sb.auth.signOut();

// Baixa até as 1000 leituras e 1000 eventos mais recentes (limite do Supabase por consulta)
$("btnBaixar").onclick = async () => {
  const btn = $("btnBaixar");
  const formato = $("formato").value;
  btn.disabled = true; btn.textContent = "Preparando…";
  try {
    const [l, e] = await Promise.all([
      sb.from("leituras").select("*").eq("dispositivo", DISPOSITIVO).order("criado_em", {ascending:false}).limit(1000),
      sb.from("eventos").select("*").eq("dispositivo", DISPOSITIVO).order("criado_em", {ascending:false}).limit(1000)
    ]);
    if (l.error) throw l.error;
    if (e.error) throw e.error;
    const leituras = l.data.reverse();
    const eventos = e.data.reverse();
    const carimbo = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
    const nome = DISPOSITIVO + "-" + carimbo;

    if (formato === "xlsx") {
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(leituras), "leituras");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(eventos), "eventos");
      XLSX.writeFile(wb, nome + ".xlsx");
    } else {
      const dados = { dispositivo: DISPOSITIVO, exportado_em: new Date().toISOString(), leituras, eventos };
      const blob = new Blob([JSON.stringify(dados, null, 2)], {type: "application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = nome + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
  } catch (err) {
    alert("Não foi possível baixar: " + (err.message || err));
  } finally {
    btn.disabled = false; btn.textContent = "Baixar";
  }
};

sb.auth.onAuthStateChange((_ev, session) => session ? mostrarApp() : mostrarLogin());
sb.auth.getSession().then(({data}) => data.session ? mostrarApp() : mostrarLogin());
</script>
</body>
</html>
